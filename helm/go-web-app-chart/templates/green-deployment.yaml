apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-green
spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Release.Name }}
      version: green

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: green

    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.green.image.repository }}:{{ .Values.green.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
